<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="丈量大師">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="丈量大師：門窗與採光罩現場丈量、施工圖、CAD、報價一次完成，可離線使用。">
<meta name="theme-color" content="#F5C518">
<meta name="robots" content="noindex, nofollow">
<title>丈量大師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#E7EAED;--surface:#FFFFFF;--ink:#1B2430;--muted:#5D6B7A;--line:#CBD2D9;
  --tape:#F5C518;--tape-ink:#1B2430;--dim:#0B7285;--danger:#B42318;--chip:#F1F3F5;--ok:#1E7B4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#13181E;--surface:#1D242C;--ink:#E4E9EE;--muted:#98A6B4;--line:#33404C;--dim:#3BC9DB;--danger:#F97066;--chip:#26303A;--ok:#5FD39B}
}
:root[data-theme="dark"]{--bg:#13181E;--surface:#1D242C;--ink:#E4E9EE;--muted:#98A6B4;--line:#33404C;--dim:#3BC9DB;--danger:#F97066;--chip:#26303A;--ok:#5FD39B}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,"PingFang TC","Heiti TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--dim)}
:focus-visible{outline:3px solid var(--dim);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--tape);color:var(--tape-ink)}
.bar-inner{display:flex;align-items:center;gap:8px;min-height:54px;padding:6px 12px;max-width:760px;margin:0 auto}
.bar::after{content:"";display:block;height:12px;background:
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1.5px,transparent 1.5px 10px) left bottom/100% 5px no-repeat,
  repeating-linear-gradient(90deg,var(--tape-ink) 0 2px,transparent 2px 50px) left bottom/100% 12px no-repeat}
.title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:"Barlow Condensed","PingFang TC",sans-serif;font-weight:700;font-size:23px}
.back,.barbtn{appearance:none;border:0;background:transparent;font-weight:600;padding:8px 4px;min-height:44px;max-width:40%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tape-ink)}
.barbtn{border:1.5px solid var(--tape-ink);border-radius:10px;padding:6px 12px;min-height:38px}

main{max-width:760px;margin:0 auto;padding:16px 14px 56px}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:26px 2px 8px}
.num{font-family:"Barlow Condensed",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pad{padding:14px}

.b{appearance:none;display:block;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:12px 16px;font-weight:600;min-height:50px;text-align:center}
.b.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b.ghost{background:transparent;border-color:transparent}
.b.danger{color:var(--danger)}
.b:disabled{opacity:.5}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:14px;color:var(--muted);margin:12px 2px}
.empty{color:var(--muted);text-align:center;padding:30px 16px}

.search{margin-top:14px}
.list{display:grid;gap:10px;margin-top:14px}
.card{appearance:none;display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--muted);font-size:13px;grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .big{grid-row:1/4;grid-column:2;align-self:center;text-align:right;font-size:26px;font-weight:600;line-height:1}
.card .big small{display:block;font-family:-apple-system,"PingFang TC",sans-serif;font-size:12px;margin-top:4px}
.st{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;color:var(--muted)}
.st.s2,.st.s3{color:var(--dim);border-color:var(--dim)}
.st.s4{color:var(--ok);border-color:var(--ok)}

.item{appearance:none;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;
  text-align:left;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:transparent}
.item:last-child{border-bottom:0}
.idx{font:700 20px/1 "Barlow Condensed",sans-serif;color:var(--muted)}
.nm{min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:13px}
.size{font:600 22px/1.1 "Barlow Condensed",sans-serif;text-align:right;white-space:nowrap}
.size small{display:block;font:500 13px/1.4 -apple-system,"PingFang TC",sans-serif;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{appearance:none;border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:9px 15px;font-weight:600;min-height:44px}
.chip.on{border-style:solid;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tot{display:flex;flex-wrap:wrap;gap:4px 18px;padding:10px 4px 0;color:var(--muted);font-size:14px;align-items:baseline}
.tot b{font:600 24px/1 "Barlow Condensed",sans-serif;color:var(--ink);margin-right:3px}

.form{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
.fld em{font-style:normal;font-weight:400;margin-left:6px}
.fld .row{display:flex;gap:8px}
.fld .row a{display:flex;align-items:center;justify-content:center;min-width:58px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;text-decoration:none}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none;margin:0}
textarea{min-height:84px;resize:vertical}
select{padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.suf{position:relative}
.suf input{padding-right:46px;font:600 21px/1 "Barlow Condensed",-apple-system,sans-serif}
.suf i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.tog{flex-direction:row;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px;min-height:46px;align-self:end}
.tog>span{font-size:15px;color:var(--ink)}
.tog input{width:52px;height:32px;min-height:0;padding:0;border:0;border-radius:16px;background:var(--line);position:relative;flex:none}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked{background:var(--dim)}
.tog input:checked::after{transform:translateX(20px)}

.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{appearance:none;flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:600;min-height:44px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.paper{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;overflow:auto}
.paper svg{display:block;width:100%;height:auto}
.v3{background:#EEF1F4;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;min-height:240px}
.v3 canvas{display:block;touch-action:none;width:100%}
.v3 .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5D6B7A;font-weight:600;text-align:center;padding:20px}
.views{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.views button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;min-height:40px}
.views button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prow{display:grid;grid-template-columns:40px 1fr 1fr 62px 42px;gap:6px;align-items:center;margin-bottom:6px}
.prow b{font:700 17px/1 "Barlow Condensed",sans-serif;color:var(--muted)}
.prow input{min-height:42px;padding:8px 10px;font:600 19px/1 "Barlow Condensed",-apple-system,sans-serif}
.mini{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.mini input{width:20px;height:20px;min-height:0;padding:0;-webkit-appearance:checkbox;appearance:auto}
.x{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;color:var(--danger);font-weight:700}
.paper svg *{pointer-events:none}
.paper svg [data-cell]{pointer-events:auto;cursor:pointer}
.paper svg [data-obj]{pointer-events:all;cursor:pointer}
.paper.drag{touch-action:none;outline:2px dashed var(--dim);outline-offset:2px}
.paper.zoom svg{width:220%;max-width:none}
details.panel>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;gap:8px;min-height:48px;align-items:center}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"＋";color:var(--muted)}
details.panel[open]>summary::after{content:"－"}
details.panel+details.panel,details.panel+.panel{margin-top:10px}
.clist{display:grid;gap:6px;max-height:340px;overflow:auto}
.citem{appearance:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:46px}
.citem small{color:var(--muted);font-size:12px}
.citem .w{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;color:var(--dim);font-weight:600}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;background:var(--chip)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}
.kv b{color:var(--muted);font-weight:600}
.selp{border-color:var(--dim);margin-top:10px}
.nud{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nud button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;font-weight:700}
.metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 4px 2px;color:var(--muted);font-size:14px}
.metric b{font:600 36px/1 "Barlow Condensed",sans-serif;color:var(--ink);margin-right:2px}
.warn{flex-basis:100%;color:var(--danger);font-size:14px;font-weight:600}
.info{flex-basis:100%;color:var(--dim);font-size:14px;font-weight:600}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{appearance:none;aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--chip);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sel{outline:3px solid var(--dim);outline-offset:-3px}
.ph.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--dim);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.addph{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:1px dashed var(--muted);border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;text-align:center;padding:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.ai-out{white-space:pre-wrap;font-size:15px;line-height:1.65;padding:14px;border-top:1px solid var(--line)}
.ai-out:empty{display:none}
.logo{width:88px;height:88px;border-radius:12px;border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--muted);font-size:13px;text-align:center}
.logo img{max-width:100%;max-height:100%}
.pricerow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.pricerow:last-child{border-bottom:0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.busy{position:fixed;inset:0;z-index:50;background:rgba(19,24,30,.55);display:none;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:17px}
.busy.on{display:flex}
.sheet{position:fixed;inset:0;z-index:55;background:rgba(19,24,30,.5);display:flex;align-items:flex-end;justify-content:center;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-box{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:86vh;overflow:auto}
.sheet-box p{margin:0 0 16px;font-size:17px}
.sheet-box textarea{min-height:260px;font-size:14px;margin-bottom:12px}
.sheet-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.photos{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy"><span id="busyText">處理中…</span></div>
<script>
(()=>{
'use strict';
/* ================= 資料定義 ================= */
const OPT={
  series:['一般窗','氣密窗','隔音氣密窗','景觀窗','其他'],
  glass:['5mm 清玻璃','5mm 綠玻璃','5mm 霧面玻璃','8mm 強化玻璃','5+5 膠合玻璃','複層玻璃','其他'],
  color:['白色','銀色','香檳金','咖啡色','黑色','其他'],
  dir:['上推','左側推','右側推'],
  style:['單開','雙開','子母門','橫拉門','雙橫拉門','折疊門','穀倉門','自動感應門','防火門','玄關門（含側窗）'],
  hinge:['左','右'],
  panel:['PC耐力板 6mm','PC耐力板 8mm','PC中空板','強化玻璃 8mm','膠合玻璃 5+5','鋁板','其他'],
  frame:['鋁骨架','鍍鋅鋼骨架','不鏽鋼骨架'],
  drain:['前排水','左側排水','右側排水']
};
const STATUS=['丈量中','已報價','已下單','施工中','已完工'];
const FIELDS={
  tri:{l:'三點量測（取最小值）',t:'bool'},
  W:{l:'寬',t:'len'},H:{l:'高',t:'len'},
  W1:{l:'寬（上）',t:'len'},W2:{l:'寬（中）',t:'len'},W3:{l:'寬（下）',t:'len'},
  H1:{l:'高（左）',t:'len'},H2:{l:'高（中）',t:'len'},H3:{l:'高（右）',t:'len'},
  panels:{l:'扇數',t:'sel',o:[2,3,4]},
  screen:{l:'紗窗',t:'bool'},
  cols:{l:'直向分割',t:'int',min:1,max:8},
  rows:{l:'橫向分割',t:'int',min:1,max:8},
  sash:{l:'扇數',t:'int',min:1,max:6},
  dir:{l:'開啟方式',t:'sel',o:OPT.dir},
  style:{l:'門型',t:'sel',o:OPT.style},
  hinge:{l:'鉸鏈側（外看）',t:'sel',o:OPT.hinge},
  transom:{l:'上氣窗高',t:'len',hint:'0 = 無'},
  series:{l:'窗型系列',t:'sel',o:OPT.series},
  glass:{l:'玻璃',t:'sel',o:OPT.glass},
  color:{l:'顏色',t:'sel',o:OPT.color},
  L:{l:'長（沿牆）',t:'len'},D:{l:'深（出挑）',t:'len'},
  Hb:{l:'後高（牆側）',t:'len'},Hf:{l:'前高',t:'len'},
  posts:{l:'立柱數',t:'int',min:0,max:12,hint:'0 = 掛壁式'},
  spacing:{l:'骨架間距（沿長向）',t:'len'},
  pspacing:{l:'橫料間距（沿斜面）',t:'len'},
  panel:{l:'板材',t:'sel',o:OPT.panel},
  frame:{l:'骨架',t:'sel',o:OPT.frame},
  drain:{l:'排水',t:'sel',o:OPT.drain},
  form:{l:'造型',t:'sel',o:['拱形窗','圓窗','八角窗','斜頂梯形窗','內開內倒窗','上懸窗','折疊窗','凸窗（三面）']},
  RW:{l:'房間寬（X）',t:'len'},RD:{l:'房間深（Y）',t:'len'},RH:{l:'天花板高',t:'len'},wallT:{l:'牆厚',t:'len'}
};
/* 有鉸鏈（需要選左右開）的門型 */
const HINGED=new Set(['單開','防火門','玄關門（含側窗）']);
const TYPES={
  slide:{n:'橫拉窗',f:['tri','W','H','panels','screen','series','glass','color'],d:{W:1800,H:1200,panels:2,screen:true}},
  fixed:{n:'固定窗',f:['tri','W','H','cols','rows','series','glass','color'],d:{W:1200,H:1200,cols:1,rows:1}},
  casement:{n:'推射窗',f:['tri','W','H','sash','dir','screen','series','glass','color'],d:{W:900,H:1200,sash:1,screen:true}},
  louver:{n:'百葉窗',f:['tri','W','H','cols','screen','color'],d:{W:1000,H:1100,cols:1}},
  shaped:{n:'造型窗',f:['tri','W','H','form','screen','series','glass','color'],d:{W:1200,H:1500,form:'拱形窗'}},
  door:{n:'門',f:['tri','W','H','style','hinge','transom','series','glass','color'],d:{W:900,H:2100,transom:0}},
  canopy:{n:'採光罩',f:['L','D','Hb','Hf','posts','spacing','pspacing','panel','frame','drain','color'],d:{L:5000,D:2000,Hb:3000,Hf:2600,posts:2,spacing:600,pspacing:1000}},
  room:{n:'室內平面圖',f:['RW','RD','RH','wallT'],d:{RW:5000,RD:4000,RH:2800,wallT:120,objs:[],tpl:'blank'}}
};
const LOCS=['客廳','主臥','次臥','小孩房','書房','廚房','浴室','陽台','後陽台','樓梯間','前門','後門','頂樓','車庫'];
const DEF_SETTINGS={co:{name:'',phone:'',addr:'',taxid:'',line:'',staff:''},logo:null,
  prices:{slide:0,fixed:0,casement:0,louver:0,shaped:0,door:0,canopy:0,room:0},minCai:0,tax:false,
  terms:'1. 本報價有效期限 30 天。\n2. 尺寸以現場丈量為準，下單後依實際尺寸計價。\n3. 訂金 30%，完工驗收後付清尾款。',
  pdfQuote:true,pdfPhotos:true,pdfRenders:true,wake:true,lastBackup:'',
  render:{style:'',light:'day',view:'eye',tool:'chatgpt',ref:'3d',lang:'zh'}};

  /* ---------- 用電估算 ----------
   * 導線安培容量：PVC 絕緣線、同一導線管內 3 條以下、周溫 35°C 以下的常用估算值（保守取整）。
   * 實際仍須依「用戶用電設備裝置規則」修正係數（管內條數、周溫、電壓降）由合格電匠／電機技師確認。 */
  const NFB=[15,20,30,40,50,60,75,100,125,150,175,200,225,250,300,350,400,500,600];
  const WIRE=[['2.0mm',20],['3.5mm²',25],['5.5mm²',30],['8mm²',40],['14mm²',55],['22mm²',70],['30mm²',80],['38mm²',95],['50mm²',110],['60mm²',125],['80mm²',150],['100mm²',175],['125mm²',200],['150mm²',225],['200mm²',260],['250mm²',290],['325mm²',330]];

  /* 一般插座迴路：110V、NFB 20A → 設計電流 ≤16A 附近；取 1600VA（14.5A，×1.25=18.2A）且最多 8 個出線口 */
  const GEN_W=1600,GEN_N=8,LIGHT_W=1200;

  function elec(objs,opt){opt=opt||{};const cs=new Map(),order=[];

    let g=0,gw=0,l=0,d=0;const cur={};
    for(const o of objs||[]){const L=load(o);if(!(L.watt>0))continue;let c;

      else if(L.light){const k='L';if(!cur[k]||cur[k].W+L.watt/L.pf>LIGHT_W){l++;cur[k]=get('L'+l,'照明 '+l,110,'light')}c=cur[k]}
      else if(L.v===220||L.ded||L.watt>=1500){d++;c=get('D'+d,'專用 '+L.name,L.v,'ded')}
      else{const k=L.wet?'W':'G';if(!cur[k]||cur[k].VA+L.watt/L.pf>GEN_W||cur[k].items.length>=GEN_N){g++;cur[k]=get('G'+g,(L.wet?'潮濕插座 ':'一般插座 ')+g,110,'gen')}c=cur[k]}
      if(c.kind==='user'&&L.v===220)c.v=220;
      c.items.push(L.name);c.W+=L.watt;c.VA+=L.watt/L.pf;c.wet=c.wet||L.wet}
    const circuits=order.map(id=>{const c=cs.get(id),I=c.VA/c.v,Id=I*1.25,nfb=pickNFB(Math.max(Id,15));
      return {...c,I,Id,nfb,wire:pickWire(nfb),elcb:c.wet}});
    const totVA=circuits.reduce((a,c)=>a+c.VA,0);
    const gl=circuits.filter(c=>c.kind==='gen'||c.kind==='light').reduce((a,c)=>a+c.VA,0),rest=totVA-gl;
    /* 需量：一般插座＋照明「前 3000VA 計 100%、其餘 50%」，專用迴路設備計 100%——住宅估算慣例，偏保守 */

    const Imain=dmdVA/220,mainNfb=pickNFB(Math.max(Imain*1.25,30)),mainWire=pickWire(mainNfb||0),bus=BUS.find(b=>b>=(mainNfb||0))||null;

    if(Imain>100)notes.push(`估算主幹電流約 ${Math.round(Imain)}A，已超過一般住宅單相 3 線常見的 60～100A，請洽台電評估契約容量，或改三相供電。`);

    return {circuits,totVA,dmdVA,Imain,mainNfb,mainWire,bus,slots,notes}}

  /* ---------- 範本產生器（座標 mm：原點在室內左上角，X 往右、Y 往下） ---------- */
  let seq=0;const oid=()=>'o'+Date.now().toString(36)+(seq++).toString(36);
  const O=(k,x,y,r,ex)=>({id:oid(),k,x:Math.round(x),y:Math.round(y),r:((r||0)%360+360)%360,...(ex||{})});
  const rot=(r,x,y)=>{const a=r*Math.PI/180;return [x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)]};

  const seat=(o,k,dx,gap)=>{const c=byK[o.k],[x,y]=rot(o.r,dx||0,c?(o.d||c.d)/2+(gap||330):650);return O(k||'chair',o.x+x,o.y+y,o.r)};

    {id:'blank',n:'空白房間',cat:'通用',W:4000,D:3000,kw:['空白'],gen:(W,D)=>({W,D,objs:[O('door',W-700,D,0),O('out',W/2,20,0),O('panel',300,75,0)]})},

      const tl=Math.min(Math.max(Math.ceil(n/2)*650+400,1800),W-1400),D2=Math.max(D,3600);D=D2;

      const top=Math.ceil(n/2),bot=n-top;

      for(let i=0;i<bot;i++)o.push(O('mchair',W/2-tl/2+(i+0.5)*tl/bot,t.y+600+330,0));
      o.push(O('touch',W/2,450,0),O('vc',W/2,90,0),O('rj45',W/2+900,20,0),O('out',W/2-900,20,0),O('out',20,D/2,90),O('out',W-20,D/2,270),
        O('weak',W-350,75,0),O('ac',900,125,0),O('door',W-700,D,0),...lights(W,D));return {W,D,objs:o}}},
    {id:'eoc',n:'緊急應變會議室（U 型指揮）',cat:'辦公',W:8000,D:6400,np:12,kw:['緊急','應變','EOC','指揮','災害','防災','戰情'],gen:(W,D,n)=>{n=n||12;
      const cap=(W,D)=>2*Math.floor((D-2600)/1400)+Math.floor((W-3600)/1400);
      while(cap(W,D)<n&&W<30000){W+=1000;D+=600}
      const o=[O('vwall',W/2,150,0,{w:Math.min(4000,W-3000)}),O('radio',1000,450,0),O('rack',W-400,600,0),O('ups',W-1100,550,0)];
      const la=Math.floor((D-2600)/1400),ba=Math.floor((W-3600)/1400);let left=n;
      const put=(x,y,r)=>{if(left<=0)return;const dk=O('eocdesk',x,y,r);o.push(dk,seat(dk,'chair'),O('outF',x,y,0));left--};
      for(let i=0;i<la&&left>0;i++){put(1500,1500+i*1400+700,90);if(left>0)put(W-1500,1500+i*1400+700,270)}
      for(let i=0;i<ba&&left>0;i++)put(1800+(i+0.5)*(W-3600)/ba,D-1500,0);

    d.rect(ix,iy,iw,ih,'SASH','sash',0.7);
    for(let i=0;i<n;i++){const x=ix+i*(w+m);d.rect(x,iy,w,ih,'SASH','sash');glass(x+f*0.6,iy+f*0.6,w-f*1.2,ih-f*1.2);
      vee(x,iy,w,ih,p.dir==='左側推'?'left':p.dir==='右側推'?'right':'top')}
    if(n>1)cB=Array(n).fill(W/n)}

      const cx=x+pw/2,s=(i<n/2?1:-1)*(out?-1:1);d.arrow(cx-s*pw*0.18,dy+dh/2,cx+s*pw*0.18,dy+dh/2)}};

}

const build=it=>it.type==='canopy'?bCanopy(it):it.type==='room'?bRoom(it):bWin(it);

    else if(q.t==='r')o+=`<rect x="${r1(q.x)}" y="${r1(q.y)}" width="${r1(q.w)}" height="${r1(q.h)}" fill="${q.fill?FILL[q.fill]:'none'}" stroke="${stroke}" stroke-width="${sw}"${ds}/>`;

    else if(q.t==='t'){const a=`font-size="${r1(q.size)}" fill="${stroke}" text-anchor="${q.anchor}" font-family="${FONT}"${q.bold?' font-weight="700"':''}`;
      o+=q.rot?`<text transform="translate(${r1(q.x)} ${r1(q.y)}) rotate(${q.rot})" ${a}>${esc(q.s)}</text>`:`<text x="${r1(q.x)}" y="${r1(q.y)}" ${a}>${esc(q.s)}</text>`}
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${r1(b.x)} ${r1(b.y)} ${r1(b.w)} ${r1(b.h)}" ${size} preserveAspectRatio="xMidYMid meet"><rect x="${r1(b.x)}" y="${r1(b.y)}" width="${r1(b.w)}" height="${r1(b.h)}" fill="#fff"/>${o}</svg>`;

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);

    ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz}

/* ---------- 幾何工具 ---------- */
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1]}return a/2}
function bbox(P){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const [x,y] of P){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return {x0,y0,x1,y1}}
function clipRect(poly,x1,y1,x2,y2){
  const cl=(P,inside,inter)=>{const o=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],ia=inside(a),ib=inside(b);
    if(ia){o.push(a);if(!ib)o.push(inter(a,b))}else if(ib)o.push(inter(a,b))}return o};
  const X=(a,b,x)=>[x,a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])],Y=(a,b,y)=>[a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]),y];
  let r=cl(poly,p=>p[0]>=x1,(a,b)=>X(a,b,x1));
  if(r.length)r=cl(r,p=>p[0]<=x2,(a,b)=>X(a,b,x2));
  if(r.length)r=cl(r,p=>p[1]>=y1,(a,b)=>Y(a,b,y1));
  if(r.length)r=cl(r,p=>p[1]<=y2,(a,b)=>Y(a,b,y2));
  return r}
function spans(P,axis,c){const v=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    const pa=axis==='x'?a[0]:a[1],qa=axis==='x'?a[1]:a[0],pb=axis==='x'?b[0]:b[1],qb=axis==='x'?b[1]:b[0];
    if((pa<=c&&pb>c)||(pb<=c&&pa>c))v.push(qa+(qb-qa)*(c-pa)/(pb-pa))}
  v.sort((a,b)=>a-b);const o=[];for(let i=0;i+1<v.length;i+=2)if(v[i+1]-v[i]>1)o.push([v[i],v[i+1]]);return o}
function offsetPoly(P,E,offs){const n=P.length,L=E.map((e,i)=>({p:[e.a[0]+e.n[0]*offs[i],e.a[1]+e.n[1]*offs[i]],d:[e.b[0]-e.a[0],e.b[1]-e.a[1]]}));
  return P.map((_,i)=>{const l1=L[(i-1+n)%n],l2=L[i],cr=l1.d[0]*l2.d[1]-l1.d[1]*l2.d[0];if(Math.abs(cr)<1e-9)return l2.p.slice();
    const t=((l2.p[0]-l1.p[0])*l2.d[1]-(l2.p[1]-l1.p[1])*l2.d[0])/cr;return [l1.p[0]+l1.d[0]*t,l1.p[1]+l1.d[1]*t]})}
function gridLines(a,b,step,custom){const W=b-a;if(W<=0)return [a,b];const out=[a];
  if(Array.isArray(custom)&&custom.some(v=>v>0)){let s=a;for(const v of custom){if(!(v>0))continue;if(s+v>=b-1)break;s+=v;out.push(s)}
    const rem=b-s;if(rem>1&&step>0){const n=Math.max(1,Math.ceil(rem/step-1e-6));for(let i=1;i<n;i++)out.push(s+rem*i/n)}out.push(b);return out}
  const n=step>0?Math.max(1,Math.ceil(W/step-1e-6)):1;for(let i=1;i<n;i++)out.push(a+W*i/n);out.push(b);return out}
const ovl=(r,b)=>r[0]<b.x1&&r[2]>b.x0&&r[1]<b.y1&&r[3]>b.y0;
function selfIntersect(P){const n=P.length,cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
  for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;const a=P[i],b=P[(i+1)%n],c=P[j],d=P[(j+1)%n];
    if(cross(a,b,c)*cross(a,b,d)<0&&cross(c,d,a)*cross(c,d,b)<0)return true}return false}

function presetPts(p){const L=Math.max(+p.L||0,100),D=Math.max(+p.D||0,100);
  if(p.shape==='缺角'){const w=clamp(+p.nw||0,10,L-10),d=clamp(+p.nd||0,10,D-10),c=String(p.nc||'');
    if(c.startsWith('左前'))return {pts:[[0,0],[L,0],[L,D],[w,D],[w,D-d],[0,D-d]],wallE:[]};
    if(c.startsWith('右後'))return {pts:[[0,0],[L-w,0],[L-w,d],[L,d],[L,D],[0,D]],wallE:[1,2]};
    if(c.startsWith('左後'))return {pts:[[w,0],[L,0],[L,D],[0,D],[0,d],[w,d]],wallE:[4,5]};
    return {pts:[[0,0],[L,0],[L,D-d],[L-w,D-d],[L-w,D],[0,D]],wallE:[]}}
  if(p.shape==='斜邊'){const Dr=Math.max(+p.Dr||0,100);return {pts:[[0,0],[L,0],[L-(+p.oR||0),Dr],[+p.oL||0,D]],wallE:[]}}
  if(p.shape==='自訂'&&Array.isArray(p.pts)&&p.pts.length>=3)return {pts:p.pts.map(q=>[+q[0]||0,+q[1]||0]),wallE:Array.isArray(p.wallE)?p.wallE:[]};
  return {pts:[[0,0],[L,0],[L,D],[0,D]],wallE:[]}}

/* ---------- 模型（所有圖面、3D、材料、報價共用） ---------- */
let _cm={k:'',v:null};
function canopyModel(p){const key=JSON.stringify(p);if(_cm.k===key)return _cm.v;const v=calcCanopy(p);_cm={k:key,v};return v}
function calcCanopy(p){
  const pre=presetPts(p),pts=pre.pts,A=polyArea(pts),sg=A>=0?1:-1,wallSet=new Set(pre.wallE);
  const E=pts.map((a,i)=>{const b=pts[(i+1)%pts.length],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1,n=[sg*dy/len,-sg*dx/len];
    const wall=wallSet.has(i)||(Math.abs(a[1])<1&&Math.abs(b[1])<1);
    return {i,a,b,n,len,kind:wall?'wall':n[1]>0.5?'front':n[0]<-0.5?'left':n[0]>0.5?'right':'back'}});
  const sb=bbox(pts),x0=sb.x0,x1=sb.x1,y1=Math.max(sb.y1,1),Lx=Math.max(x1-x0,1),Dy=y1;
  const Hb=+p.Hb||0,Hf=+p.Hf||0,HbR=p.hlr?(+p.HbR||0):Hb,HfR=p.hlr?(+p.HfR||0):Hf;
  const H=(x,y)=>{const t=(x-x0)/Lx,b=Hb+(HbR-Hb)*t,f=Hf+(HfR-Hf)*t;return b+(f-b)*(y/Dy)};
  const rise=((Hb+HbR)-(Hf+HfR))/2,sl=Math.hypot(Dy,rise),fac=sl/Dy,ang=Math.atan2(Math.abs(rise),Dy)*180/Math.PI;
  const offs=E.map(e=>e.kind==='wall'?0:e.kind==='front'?(+p.ovF||0):(+p.ovS||0));
  const panel=offsetPoly(pts,E,offs),pb=bbox(panel);
  const xsR=gridLines(x0,x1,+p.spacing||0,p.rs);
  const ysP=gridLines(0,y1,(+p.pspacing||0)/fac,(p.ps||[]).map(v=>v/fac));
  const raf=[];for(const x of xsR){const c=clamp(x,x0+0.5,x1-0.5);for(const [ya,yb] of spans(pts,'x',c))raf.push({x,ya,yb})}
  const pur=[];for(const y of ysP){const c=clamp(y,0.5,y1-0.5);for(const [xa,xb] of spans(pts,'y',c))pur.push({y,xa,xb})}
  const X=[pb.x0,...xsR.slice(1,-1),pb.x1],Y=[Math.min(0,pb.y0),...ysP.slice(1,-1),pb.y1],marks=p.marks||{};
  const cells=[];let no=0;
  for(let r=0;r<Y.length-1;r++)for(let c=0;c<X.length-1;c++){
    const poly=clipRect(panel,X[c],Y[r],X[c+1],Y[r+1]);if(poly.length<3)continue;
    const a=Math.abs(polyArea(poly)),ra=(X[c+1]-X[c])*(Y[r+1]-Y[r]);if(a<ra*0.003)continue;
    const key=c+','+r;cells.push({c,r,key,poly,area:a,full:a>ra*0.995,state:marks[key]||'',no:++no,w:X[c+1]-X[c],l:(Y[r+1]-Y[r])*fac,bb:bbox(poly),holes:[]})}
  const obs=(p.obs||[]).map((o,i)=>{const T=obsType(o.type);let rect=null;
    if(T.k==='pipe'){const r=Math.max(+o.w||T.w,10)/2;rect=[+o.x-r,+o.y-r,+o.x+r,+o.y+r]}
    else if(T.k==='area')rect=[+o.x||0,+o.y||0,(+o.x||0)+(+o.w||0),(+o.y||0)+(+o.d||0)];
    return {...o,i,no:i+1,k:T.k,rect}});
  for(const o of obs)if(o.rect)for(const cl of cells)if(ovl(o.rect,cl.bb))cl.holes.push(o);
  let planA=0;for(const cl of cells)if(cl.state!=='void')planA+=cl.area;
  for(const o of obs)if(o.rect&&o.mode===OBS_MODE[1])planA-=Math.abs(polyArea(clipRect(panel,...o.rect)));
  planA=Math.max(0,planA);
  let posts=[];
  if(p.postMode==='自訂位置')posts=(p.posts||[]).map(q=>[+q[0]||0,+q[1]||0]);
  else if(p.postMode==='自動'){const gap=Math.max(+p.postGap||0,500);
    pts.forEach((v,i)=>{const ep=E[(i-1+pts.length)%pts.length],en=E[i];if(ep.kind!=='wall'&&en.kind!=='wall')posts.push(v.slice())});
    for(const e of E)if(e.kind==='front'&&e.len>gap){const n=Math.ceil(e.len/gap);for(let j=1;j<n;j++)posts.push([e.a[0]+(e.b[0]-e.a[0])*j/n,e.a[1]+(e.b[1]-e.a[1])*j/n])}}
  const gut=[],dps=[];
  if(p.gutter){E.forEach((e,i)=>{if(e.kind==='front')gut.push([panel[i],panel[(i+1)%panel.length]])});
    if(gut.length){const v=gut.flat(),mn=v.reduce((a,b)=>b[0]<a[0]?b:a),mx=v.reduce((a,b)=>b[0]>a[0]?b:a);
      if(p.dp==='左側')dps.push(mn);else if(p.dp==='兩側')dps.push(mn,mx);
      else if(p.dp==='中間'){const g=gut.reduce((a,b)=>Math.hypot(b[1][0]-b[0][0],b[1][1]-b[0][1])>Math.hypot(a[1][0]-a[0][0],a[1][1]-a[0][1])?b:a);dps.push([(g[0][0]+g[1][0])/2,(g[0][1]+g[1][1])/2])}
      else dps.push(mx)}}
  const enc=[];for(const e of E){const t=e.kind==='front'?p.encF:e.kind==='left'?p.encL:e.kind==='right'?p.encR:null;if(t&&t!=='無')enc.push({e,t})}
  const live=cells.filter(c=>c.state!=='void');
  return {pts,E,panel,pb,x0,x1,y1,Lx,Dy,H,Hb,Hf,HbR,HfR,sl,fac,ang,xsR,ysP,raf,pur,X,Y,cells,live,obs,posts,gut,dps,enc,planA,
    m2:planA*fac/1e6,area:A,self:selfIntersect(pts)};
}
function canopyMetrics(it){const M=canopyModel(it.p),q=it.qty||1,one=M.m2;
  return {canopy:true,sl:M.sl,ang:M.ang,one,m2:one*q,ping:one*q/3.3058,nR:M.xsR.length,nP:M.ysP.length,cols:M.X.length-1,rows:M.Y.length-1,
    cells:M.live.length,full:M.live.filter(c=>c.full).length,cut:M.live.filter(c=>!c.full).length,
    holes:M.obs.filter(o=>o.mode===OBS_MODE[0]).length,cellW:M.Lx/(M.xsR.length-1),cellL:M.sl/(M.ysP.length-1)}}
function canopyWarnings(it){const p=it.p,M=canopyModel(p),w=[];
  if(M.pts.length<3||Math.abs(M.area)<1e4)w.push('外形點數不足或面積為 0，請檢查座標');
  if(M.self)w.push('外形的邊互相交叉，請檢查座標順序（要沿外圍依序輸入）');
  if(M.Hf>M.Hb||M.HfR>M.HbR)w.push('前高高於後高，雨水會流向牆面，請確認');
  else if(M.ang<3)w.push('斜度偏小，雨水容易積留，請確認');
  if(Math.min(M.Hf,M.HfR)<2000)w.push(`前高低於 ${fmtLen(2000)} ${unit}，出入可能撞頭`);
  if(p.shape==='矩形'&&+p.diag1>0&&+p.diag2>0){const dd=Math.abs(p.diag1-p.diag2);if(dd>10)w.push(`對角線相差 ${dd} mm，現場不方正，建議改用「自訂」外形照實際點位輸入`)}
  if(p.postMode!=='自訂位置'&&p.postMode!=='自動'&&M.Dy>1500)w.push(`掛壁式出挑 ${fmtLen(M.Dy)} ${unit}，請確認壁面強度與斜撐`);
  if(p.postMode!=='掛壁式（無柱）'){for(const e of M.E){if(e.kind!=='front')continue;
    const ts=M.posts.map(q=>{const t=((q[0]-e.a[0])*(e.b[0]-e.a[0])+(q[1]-e.a[1])*(e.b[1]-e.a[1]))/(e.len*e.len);
      const px=e.a[0]+(e.b[0]-e.a[0])*t,py=e.a[1]+(e.b[1]-e.a[1])*t;return Math.hypot(q[0]-px,q[1]-py)<80&&t>-0.02&&t<1.02?clamp(t,0,1):null}).filter(t=>t!==null).sort((a,b)=>a-b);
    const pre=M.E[(e.i-1+M.E.length)%M.E.length],nxt=M.E[(e.i+1)%M.E.length];
    if(pre.kind==='wall')ts.unshift(0);if(nxt.kind==='wall')ts.push(1);
    if(ts.length<2){w.push(`有一段前樑（${fmtLen(e.len)} ${unit}）沒有立柱支撐`);continue}
    let g=0;for(let i=1;i<ts.length;i++)g=Math.max(g,(ts[i]-ts[i-1])*e.len);if(g>3500)w.push(`前樑跨距約 ${fmtLen(g)} ${unit}，請確認樑的規格或加柱`)}}
  if(/玻璃/.test(p.panel)&&+p.ovF>150)w.push('玻璃出簷較長，請與玻璃廠確認厚度與支撐方式');
  if(!p.gutter&&!(+p.ovF>=50))w.push('沒有排水溝也沒有出簷，雨水會沿前樑流下');
  if(M.enc.length&&p.heater)w.push('封閉範圍內有燃氣熱水器：須移到室外或改強制排氣型，否則有一氧化碳中毒風險');
  if(['encF','encL','encR'].every(k=>p[k]&&p[k]!=='無'))w.push('三面全罩：請預留通風窗與逃生開口');
  for(const o of M.obs){const T=obsType(o.type);
    if(T.k==='wall'){const top=(+o.h||0)+(+o.d||0),line=Math.max(M.Hb,M.HbR);if(+o.h<line+150&&top>line-250)w.push(`#${o.no} ${o.type}與壁面固定線高度重疊，請調整後高或避開`)}
    else if(o.type==='樓梯口'){const h=M.H((o.rect[0]+o.rect[2])/2,(o.rect[1]+o.rect[3])/2);if(h<2100)w.push(`#${o.no} 樓梯口上方淨高約 ${fmtLen(h)} ${unit}，請確認`)}
    if(o.rect&&o.k!=='wall'){const cx=(o.rect[0]+o.rect[2])/2,cy=(o.rect[1]+o.rect[3])/2;if(cx<M.pb.x0||cx>M.pb.x1||cy<0||cy>M.pb.y1)w.push(`#${o.no} ${o.type}位置在採光罩範圍外`)}}
  const holes=M.obs.filter(o=>o.mode===OBS_MODE[0]).length;if(holes)w.push(`需開孔 ${holes} 處，請備防水套管與收邊`);

/* ---------- 材料明細 ---------- */
function groupLens(arr,fmt){const m=new Map();for(const v of arr){const k=Math.round(v/10)*10;m.set(k,(m.get(k)||0)+1)}
  return [...m.entries()].sort((a,b)=>b[0]-a[0]).map(([l,n])=>`${fmt?fmt(l):fmtLen(l)} ×${n}`).join('、')||'—'}
function canopyBOM(it){const p=it.p,M=canopyModel(p),rows=[],q=it.qty||1;
  const dHdy=x=>(M.H(x,M.Dy)-M.H(x,0))/M.Dy,dHdx=y=>(M.H(M.x1,y)-M.H(M.x0,y))/M.Lx;
  rows.push(['骨架（沿斜面）',groupLens(M.raf.map(s=>(s.yb-s.ya)*Math.hypot(1,dHdy(s.x))))+` 支（單位 ${unit}）`]);
  rows.push(['橫料',groupLens(M.pur.map(s=>(s.xb-s.xa)*Math.hypot(1,dHdx(s.y))))+' 支']);
  const sum=k=>M.E.filter(e=>k.includes(e.kind)).reduce((a,e)=>a+e.len,0);
  rows.push(['前樑',`${fmtLen(sum(['front']))} ${unit}`],['側樑',`${fmtLen(sum(['left','right','back']))} ${unit}`],['壁面固定料',`${fmtLen(sum(['wall']))} ${unit}（壁面收邊防水同長）`]);
  rows.push(['立柱',M.posts.length?`${M.posts.length} 支：${groupLens(M.posts.map(q2=>M.H(q2[0],q2[1])))}`:'無（掛壁式）']);
  const full=M.live.filter(c=>c.full&&c.state!=='hatch'),cut=M.live.filter(c=>!c.full&&c.state!=='hatch'),hatch=M.live.filter(c=>c.state==='hatch');
  {const m=new Map();for(const c of full){const k=`${fmtLen(Math.round(c.w/10)*10)}×${fmtLen(Math.round(c.l/10)*10)}`;m.set(k,(m.get(k)||0)+1)}
   rows.push(['板材（整片）',full.length?[...m.entries()].map(([k,n])=>`${k} ×${n}`).join('、')+` 片（寬×沿斜面長，${unit}）`:'—'])}
  rows.push(['板材（異形）',cut.length?`${cut.length} 片：`+cut.map(c=>`#${c.no} ${fmtLen(c.bb.x1-c.bb.x0)}×${fmtLen((c.bb.y1-c.bb.y0)*M.fac)}`).join('、'):'—']);
  if(hatch.length)rows.push(['可開式維修孔',`${hatch.length} 處：`+hatch.map(c=>'#'+c.no).join('、')]);
  const holeCells=M.live.filter(c=>c.holes.some(o=>o.mode===OBS_MODE[0]));
  if(holeCells.length)rows.push(['開孔位置',holeCells.map(c=>`格 #${c.no}（${c.holes.map(o=>o.type.replace(/（.*）/,'')).join('、')}）`).join('、')]);
  rows.push(['屋面面積',`${M.m2.toFixed(2)} m²（${(M.m2/3.3058).toFixed(2)} 坪）× ${q} 組`]);
  if(p.gutter){const gl=M.gut.reduce((a,g)=>a+Math.hypot(g[1][0]-g[0][0],g[1][1]-g[0][1]),0);
    rows.push(['排水溝',`${fmtLen(gl)} ${unit}，落水頭 ${M.dps.length} 個，落水管約 ${M.dps.map(d=>fmtLen(M.H(d[0],d[1]))).join('、')} ${unit}`])}
  rows.push(['出簷',`前 ${fmtLen(p.ovF)}、側 ${fmtLen(p.ovS)} ${unit}`]);
  for(const en of M.enc){const e=en.e,ha=M.H(e.a[0],e.a[1]),hb=M.H(e.b[0],e.b[1]);
    rows.push([`封邊（${({front:'前',left:'左',right:'右'})[e.kind]}）`,`${en.t}，寬 ${fmtLen(e.len)}，高 ${fmtLen(Math.min(ha,hb))}～${fmtLen(Math.max(ha,hb))} ${unit}，約 ${(e.len*(ha+hb)/2/1e6).toFixed(2)} m²`])}

function bCanopy(it){

  const Hm=Math.max(M.Hb,M.HbR,M.Hf,M.HfR,1),W=pb.x1-pb.x0,Dp=pb.y1-Math.min(0,pb.y0),k=Math.max(W,Dp,Hm),d=new Dw(k);
  const fs=k*0.034,pw=k*0.014,xL=pb.x0,xR=pb.x1;
  const title=(y,s)=>d.text(xL,y,s,fs*1.1,'TEXT','start',0,true);
  const encFill=(poly,t,label)=>{
    if(t==='實牆')d.poly(poly,'WALL','wall',true,0.8);
    else if(t==='百葉'||t==='隔柵'){d.poly(poly,'SASH','white',true,0.8);const bb=bbox(poly);
      if(t==='百葉')for(let y=bb.y0+100;y<bb.y1;y+=100)d.line(bb.x0+k*0.004,y,bb.x1-k*0.004,y,'GRID',0.7);

  d.poly(panel.map(q=>[q[0],fz(q[0],q[1])]),'GLASS','glass',true,0.4);

  if(p.hlr){d.dimV(fz(M.x1,M.Dy),G1,xR+k*0.08,xR,fmtLen(H(M.x1,M.Dy)));d.dimV(fz(M.x1,0),G1,xR+k*0.16,xR,fmtLen(H(M.x1,0)))}

  /* 俯視圖 */

  title(y0-k*0.13,`俯視圖　板材 ${M.live.length} 片（整片 ${M.live.filter(c=>c.full).length}、異形 ${M.live.filter(c=>!c.full).length}）`);
  for(const e of E)if(e.kind==='wall'){if(Math.abs(e.a[1])<1&&Math.abs(e.b[1])<1)d.rect(Math.min(e.a[0],e.b[0]),y0-k*0.03,e.len,k*0.03,'WALL','wall');else d.line(e.a[0],y0+e.a[1],e.b[0],y0+e.b[1],'WALL',8)}

  const showNo=M.cells.length<=90;
  for(const c of M.cells){const fill=c.state==='void'?'white':c.state==='hatch'?'hatch':c.holes.some(o=>o.mode===OBS_MODE[0])?'hole':'glass';
    d.poly(c.poly.map(P),'GLASS',fill,true,0.5,c.key);
    const cx=(c.bb.x0+c.bb.x1)/2,cy=y0+(c.bb.y0+c.bb.y1)/2,sz=Math.min(fs*0.62,(c.bb.x1-c.bb.x0)*0.3);
    if(c.state==='void'){d.line(c.bb.x0,y0+c.bb.y0,c.bb.x1,y0+c.bb.y1,'NOTE',0.6);d.line(c.bb.x1,y0+c.bb.y0,c.bb.x0,y0+c.bb.y1,'NOTE',0.6);d.text(cx,cy+sz*0.35,'挖空',sz,'NOTE')}

  if(+p.ovF>0||+p.ovS>0)d.poly(panel.map(P),'HIDDEN',null,true,0.8);
  for(const g of M.gut)d.line(g[0][0],y0+g[0][1],g[1][0],y0+g[1][1],'GUTTER',1.6);
  for(const [x,y] of M.dps)d.circle(x,y0+y,k*0.012,'GUTTER','white');
  for(const [x,y] of M.posts)d.rect(x-pw,y0+y-pw,pw*2,pw*2,'FRAME','ink');
  for(const o of M.obs){if(!o.rect)continue;const [a,b,c2,e]=o.rect;
    if(o.k==='pipe')d.circle((a+c2)/2,y0+(b+e)/2,Math.max((c2-a)/2,k*0.007),'OBS','white');else d.rect(a,y0+b,c2-a,e-b,'OBS',null,1.2);
    d.text((a+c2)/2,y0+b-fs*0.3,`#${o.no} ${o.type.replace(/（.*）/,'')}`,fs*0.62,'OBS')}
  { const cx=(M.x0+M.x1)/2,ln=Math.min(M.Dy*0.4,k*0.15);

  E.forEach((e,i)=>{const mx=(e.a[0]+e.b[0])/2,my=(e.a[1]+e.b[1])/2,off=(e.kind==='wall'?k*0.1:k*0.035+(e.kind==='front'?(+p.ovF||0):(+p.ovS||0)));

  /* 側視圖（從右側看） */
  const G3=cy2+k*0.3+Hm,sz=(y)=>G3-H(M.x1,y);

}

const objCat=o=>ROOM.byK[o.k]||{n:o.k,w:500,d:500,h:800,s:'rect',c:''};

function roomWarnings(it){const p=it.p,w=[],W=+p.RW||0,D=+p.RD||0;

function drawObj(d,o,t,fs,k,hit){

    case 'bench':Rr(-hw,-hd,hw,hd);Ln(-hw,0,hw,0,'FRAME',1.6);Ln(0,-hd,0,hd,'GRID');break;

function fieldHTML(k,v,lo){const f=FIELDS[k],ll=lo||f.l;
  const lab=`<span>${ll}${f.hint?`<em>${f.hint}</em>`:''}</span>`;
  if(f.t==='list')return `<label class="fld">${lab}<div class="suf"><input inputmode="text" data-f="${k}" value="${(v||[]).map(fmtLen).join(', ')}" placeholder="例：60, 60, 55" autocomplete="off"><i>${unit}</i></div></label>`;
  if(f.t==='len')return `<label class="fld">${lab}<div class="suf"><input inputmode="decimal" data-f="${k}" value="${fmtLen(v)}" autocomplete="off"><i>${unit}</i></div></label>`;
  if(f.t==='int')return `<label class="fld">${lab}<div class="suf"><input inputmode="numeric" data-f="${k}" value="${esc(v)}" autocomplete="off"></div></label>`;
  if(f.t==='bool')return `<label class="fld tog${k==='tri'||k==='hlr'||k==='heater'?' full':''}"><span>${ll}</span><input type="checkbox" data-f="${k}" ${v?'checked':''}></label>`;
  return `<label class="fld">${lab}<select data-f="${k}">${f.o.map(o=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
}
function formFields(it){const p=it.p,out=[];
  for(const k of TYPES[it.type].f){if(k==='hinge'&&!HINGED.has(p.style))continue;
    if(p.tri&&(k==='W'||k==='H')){for(const s of ['1','2','3'])out.push(fieldHTML(k+s,p[k+s]));continue}
    out.push(fieldHTML(k,p[k]))}
  return out.join('');
}
function metricHTML(it){const m=metrics(it),p=it.p;
  if(m.room){const e=ROOM.elec(p.objs),q=hasPrices()?itemQuote(it):null;return `<span><b>${m.m2.toFixed(1)}</b>m²</span><span>${m.ping.toFixed(1)} 坪</span><span>物件 ${m.n} 件</span><span>估算負載 ${(e.totVA/1000).toFixed(1)} kVA・主開關 ${e.circuits.length?e.mainNfb+'A':'—'}</span>${q&&q.price?`<span>報價 ${money(q.amt)}</span>`:''}`+warnings(it).map(w=>`<span class="warn">${esc(w)}</span>`).join('')}
  const main=m.canopy?`<span><b>${m.m2.toFixed(2)}</b>m²</span><span>${m.ping.toFixed(2)} 坪</span><span>板材 ${m.cells} 片（整片 ${m.full}、異形 ${m.cut}）</span><span>斜長 ${fmtLen(m.sl)}</span><span>斜度 ${m.ang.toFixed(1)}°</span>`
    :`<span><b>${m.cai.toFixed(1)}</b>才</span><span>單${qtyUnit(it)} ${m.one.toFixed(1)} 才 × ${it.qty}</span>${p.tri?`<span class="info">下料尺寸 ${fmtLen(p.W)} × ${fmtLen(p.H)} ${unit}（三點取最小）</span>`:''}`;
  const q=hasPrices()?itemQuote(it):null;
  return main+(q&&q.price?`<span>報價 ${money(q.amt)}</span>`:'')+warnings(it).map(w=>`<span class="warn">${esc(w)}</span>`).join('');

function objListHTML(it){const objs=it.p.objs||[];if(!objs.length)return '<p class="note" style="margin:0">尚無物件。</p>';
  return objs.map(o=>{const c=objCat(o),{w,d}=objSize(o);return `<button class="citem" data-act="roSel" data-id="${esc(o.id)}"${o.id===view.sel?' style="border-color:var(--dim)"':''}><span>${esc(o.label||c.n)}</span><small>X ${fmtLen(o.x)}・Y ${fmtLen(o.y)}・${fmtLen(w)}×${fmtLen(d)}${o.r?`・轉 ${o.r}°`:''}</small><span class="w">${esc(c.c)}</span></button>`}).join('')}
function roomSelHTML(it){const o=(it.p.objs||[]).find(x=>x.id===view.sel);if(!o)return '';const c=objCat(o),{w,d}=objSize(o),el=c.watt!=null||c.s==='outlet';

function roomSections(it){const objs=it.p.objs||[],groups=[...new Set(ROOM.TPL.map(t=>t.cat))];

function bindDrag(){const pv=$('#preview');if(!pv||view.tool!=='move')return;let dr=null,raf=0;
  const pt=e=>{const sv=pv.querySelector('svg'),m=sv&&sv.getScreenCTM();if(!m)return null;const q=sv.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(m.inverse());return [r.x,r.y]};
  pv.addEventListener('pointerdown',e=>{const it=curItem();if(!it)return;const el=e.target.closest&&e.target.closest('[data-obj]'),o=el&&it.p.objs.find(x=>x.id===el.getAttribute('data-obj'));
    if(o){const s=pt(e);if(!s)return;dr={o,sx:s[0],sy:s[1],ox:o.x,oy:o.y,moved:false,id:e.pointerId}}
    else dr={pan:true,sx:e.clientX,sy:e.clientY,sl:pv.scrollLeft,wy:scrollY,id:e.pointerId,moved:false};
    try{pv.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()});
  pv.addEventListener('pointermove',e=>{if(!dr||e.pointerId!==dr.id)return;
    if(dr.pan){const dx=e.clientX-dr.sx,dy=e.clientY-dr.sy;pv.scrollLeft=dr.sl-dx;scrollTo(scrollX,dr.wy-dy);return}
    const s=pt(e);if(!s)return;const dx=s[0]-dr.sx,dy=s[1]-dr.sy;if(!dr.moved&&Math.hypot(dx,dy)<25)return;dr.moved=true;
    const it=curItem(),W=+it.p.RW||0,D=+it.p.RD||0;
    dr.o.x=clamp(Math.round((dr.ox+dx)/10)*10,0,W);dr.o.y=clamp(Math.round((dr.oy+dy)/10)*10,0,D);view.sel=dr.o.id;
    /* 拖曳中只用 requestAnimationFrame 重畫圖，不重建整頁，手機才不會卡 */
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;const c=curItem();if(c)pv.innerHTML=drawItem(c)})});
  const end=e=>{if(!dr||e.pointerId!==dr.id)return;const m=dr.moved&&!dr.pan;dr=null;if(m){lastDrag=Date.now();save();render()}};
  pv.addEventListener('pointerup',end);pv.addEventListener('pointercancel',end)}
function applyRoom(it,r){it.p.RW=r.W;it.p.RD=r.D;it.p.objs=r.objs;it.p.tpl=r.tpl||it.p.tpl;view.sel=null;save();render()}
async function roomIdea(p,it){const txt=($('#idea')&&$('#idea').value||'').trim();if(!txt)return toast('先輸入構想，例如：8人會議室 5x4米');ideaDraft=txt;
  if((it.p.objs||[]).length>3&&!await ask('依構想重新產生會取代目前的配置，確定嗎？','取代'))return;
  const local=ROOM.fromIdea(txt);let r=local,via='本機範本';
  if(AI){const btn=$('#ideaBtn');if(btn){btn.disabled=true;btn.textContent='AI 排版中…'}
    try{const cat=ROOM.C.map(c=>`${c.k}=${c.n}(${c.w}x${c.d}mm)`).join('; ');
      const prompt=`你是台灣室內設計師。依使用者構想，排出一間房間的平面配置。
座標單位 mm，原點在室內左上角，X 往右（寬 W）、Y 往下（深 D）。每件物件的 x,y 是「中心點」，r 是旋轉角度（0/90/180/270）。
方向慣例：r=0 的桌子，使用者坐在桌子下方（+Y 側）；椅子 r=0 面向上方（-Y）；靠上牆的櫃子、沙發、馬桶、廚具用 r=0；門與窗放在牆線上：下牆 y=D r=0、上牆 y=0 r=180、左牆 x=0 r=90、右牆 x=W r=270。
規則：物件不可重疊、主要走道至少 900mm、所有物件中心在房間內；插座（out/outF/outW/out220）與弱電（weak、rj45）要跟著用電設備與座位配置；潮濕區用 outW。
只能使用這些家具代號：${cat}
本機範本初稿（可沿用後再調整）：${JSON.stringify({W:local.W,D:local.D,objs:local.objs.map(o=>({k:o.k,x:o.x,y:o.y,r:o.r,...(o.w?{w:o.w}:{}),...(o.d?{d:o.d}:{})}))})}
使用者構想：${txt}
只回覆 JSON：{"W":數字,"D":數字,"objs":[{"k":"代號","x":數字,"y":數字,"r":0,"w":可省略,"d":可省略}]}`;
      const out=await AI.json(prompt,{});
      const W=Math.round(+out.W),D=Math.round(+out.D);
      if(W>=1200&&W<=30000&&D>=1200&&D<=30000&&Array.isArray(out.objs)){
        const objs=out.objs.slice(0,300).filter(o=>o&&ROOM.byK[o.k]).map(o=>{const x={id:ROOM.oid(),k:o.k,x:clamp(Math.round(+o.x||0),0,W),y:clamp(Math.round(+o.y||0),0,D),r:((Math.round((+o.r||0)/90)*90)%360+360)%360};
          if(+o.w>0&&+o.w<30000)x.w=Math.round(+o.w);if(+o.d>0&&+o.d<30000)x.d=Math.round(+o.d);return x});
        if(objs.length){r={tpl:local.tpl,W,D,objs};via='AI'}}}
    catch(err){toast(aiErr(err)+'，改用本機範本')}
    finally{const b=$('#ideaBtn');if(b){b.disabled=false;b.textContent='依構想快速產生'}}}
  if(!it.loc&&r.tpl!=='blank')it.loc=(ROOM.tplBy[r.tpl]||{}).n||'';
  applyRoom(it,r);toast(`已依構想產生（${via}${local.matched?'':'，沒認出空間類型，先給空白房間'}），可點選或拖曳微調`)}

function setPath(obj,path,v){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
function onField(e){const t=e.target;
  if(e.type==='change'){
    if(t.id==='photoIn'){addPhotos(Array.from(t.files||[]));t.value='';return}
    if(t.id==='logoIn'){setLogo(t.files&&t.files[0]);t.value='';return}
    if(t.id==='importIn'){importBackup(t.files&&t.files[0]);t.value='';return}
    if(t.id==='renderIn'){addRenders(Array.from(t.files||[]));t.value='';return}
  }
  if(t.id==='q'){query=t.value;$('#plist').innerHTML=cardsHTML();return}
  if(t.id==='catQ'||t.id==='catC'){if(t.id==='catQ')catQ=t.value;else catC=t.value;const l=$('#clist');if(l)l.innerHTML=catalogHTML();return}
  if(t.id==='idea'){ideaDraft=t.value;return}
  if(t.id==='tplSel'||t.id==='projTpl')return;
  if(t.dataset.sf){let v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.num!==undefined){v=parseFloat(v);if(!Number.isFinite(v)||v<0)return}
    setPath(settings,t.dataset.sf,v);saveSettings();if(t.dataset.sf==='wake')wake(v);return}
  if(t.dataset.pf){const p=cur();if(!p)return;const k=t.dataset.pf;
    if(k==='extra'){const n=parseFloat(t.value);p.extra=Number.isFinite(n)?n:0;const q=$('#qtot');if(q&&hasPrices())q.innerHTML=quoteLine(quoteTotals(p))}
    else p[k]=t.value;
    if(k==='name'){const ti=$('.title');if(ti)ti.textContent=t.value||'未命名案場'}save();return}
  const it=curItem();if(!it)return;
  if(t.dataset.if){const k=t.dataset.if;
    if(k==='qty'){const n=parseInt(t.value,10);if(!(n>0))return;it.qty=Math.min(n,999)}else it[k]=t.value;
    if(k!=='note')refreshItem();save();return}
  const p0=it.p;
  if(t.dataset.pt){const [i,j]=t.dataset.pt.split('.').map(Number),v=parseLen(t.value);if(v==null||!p0.pts||!p0.pts[i])return;p0.pts[i][j]=v;save();refreshItem();return}
  if(t.dataset.pw!==undefined){const i=+t.dataset.pw,s=new Set(p0.wallE||[]);t.checked?s.add(i):s.delete(i);p0.wallE=[...s];save();refreshItem();return}
  if(t.dataset.post){const [i,j]=t.dataset.post.split('.').map(Number),v=parseLen(t.value);if(v==null||!p0.posts[i])return;p0.posts[i][j]=v;save();refreshItem();return}
  if(t.dataset.ob){const [si,k]=t.dataset.ob.split('.'),o=p0.obs[+si];if(!o)return;
    if(k==='type'){if(o.type===t.value)return;const T=obsType(t.value);o.type=T.n;o.mode=OBS_MODE[T.m];o.w=T.w;o.d=T.d||0;o.h=T.h||0;save();render();return}
    if(k==='mode'||k==='note'){o[k]=t.value;save();if(k==='mode')refreshItem();return}
    const v=parseLen(t.value);if(v==null)return;o[k]=v;save();refreshItem();return}
  if(t.dataset.ro){const o=(p0.objs||[]).find(x=>x.id===view.sel);if(!o)return;const k=t.dataset.ro;
    if(k==='label'||k==='circ'){o[k]=t.value.slice(0,30);if(!o[k])delete o[k]}
    else if(k==='watt'){if(t.value.trim()===''){delete o.watt}else{const n=parseFloat(t.value);if(!Number.isFinite(n)||n<0)return;o.watt=Math.min(n,100000)}}
    else if(k==='v')o.v=+t.value===220?220:110;
    else{const v=parseLen(t.value);if(v==null)return;if((k==='w'||k==='d')&&!(v>0))return;o[k]=k==='x'?clamp(v,0,+p0.RW||0):k==='y'?clamp(v,0,+p0.RD||0):Math.min(v,30000)}
    save();refreshItem();return}
  if(t.dataset.f){const k=t.dataset.f,f=FIELDS[k],p=it.p;let v;
    if(f.t==='list'){v=String(t.value).split(/[,，、\s]+/).map(parseLen).filter(x=>x!=null&&x>0);if(JSON.stringify(v)===JSON.stringify(p[k]))return;p[k]=v;save();refreshItem();return}
    if(f.t==='len'){v=parseLen(t.value);if(v==null||v<0)return}
    else if(f.t==='int'){v=parseInt(t.value,10);if(!Number.isFinite(v))return;v=clamp(v,f.min,f.max)}
    else if(f.t==='bool')v=t.checked;
    else v=typeof f.o[0]==='number'?Number(t.value):t.value;
    if(p[k]===v)return;
    const prevShape=p.shape;
    p[k]=v;
    if(/^[WH][123]$/.test(k)){const key=k[0],vals=[p[key+'1'],p[key+'2'],p[key+'3']].map(Number).filter(x=>x>0);if(vals.length)p[key]=Math.min(...vals)}
    if(k==='tri'&&v){for(const s of ['1','2','3']){p['W'+s]=p['W'+s]||p.W;p['H'+s]=p['H'+s]||p.H}}
    if(k==='hlr'&&v){p.HbR=p.Hb;p.HfR=p.Hf}
    if(k==='shape'&&v==='自訂'){const pr=presetPts({...p,shape:prevShape});p.pts=pr.pts.map(q=>q.map(Math.round));p.wallE=pr.wallE.slice()}
    if(k==='postMode'&&v==='自訂位置'&&!(p.posts||[]).length){p.posts=canopyModel({...p,postMode:'自動'}).posts.map(q=>q.map(Math.round))}
    save();
    if(RERENDER.has(k)){render();return}
    refreshItem()}
}

async function backup(list){
  if(!list.length)return toast('沒有可備份的案場');busy(true,'正在打包備份…');
  try{/* 分批串流：照片逐張讀出、逐張轉成 Blob 片段，避免整包照片同時留在記憶體（低記憶體手機防 OOM） */
    const head={app:'mw-measure',v:2,at:new Date().toISOString(),projects:list,settings:list===projects?settings:undefined};
    const parts=[JSON.stringify(head).slice(0,-1)+',"photos":{'];let first=true,i=0;const ids=list.flatMap(p=>[...p.photos,...p.items.flatMap(x=>(x.renders||[]).map(r=>r.id))]);
    for(const id of ids){const d=await store.get('photo:'+id);if(!d)continue;
      parts.push(new Blob([(first?'':',')+JSON.stringify(id)+':'+JSON.stringify(d)]));first=false;
      if(++i%5===0)busy(true,`正在打包備份…（${i}/${ids.length}）`)}
    parts.push('}}');

    await saveFile(list.length===1?fname(list[0],'備份','json'):`丈量大師_全部備份_${today()}.json`,blob);
    if(list===projects){settings.lastBackup=today();saveSettings();if(view.name==='list')render()}}
  catch(err){toast('備份失敗：'+(err&&err.message||err))}
  finally{busy(false)}
}
async function importBackup(file){
  if(!file)return;/* JSON.parse 需要「整份文字＋解析後物件」同時在記憶體，峰值約檔案大小 2～3 倍；iPhone 分頁約 1GB 就會被砍，所以上限抓 150 MB */
  if(file.size>150*1024*1024)return toast('備份檔超過 150 MB，iPhone 可能記憶體不足而當掉。請改用「備份這個案場」分批匯入，或用電腦匯入');busy(true,'正在匯入…');
  try{const data=JSON.parse(await file.text());
    if(!data||data.app!=='mw-measure'||!Array.isArray(data.projects))throw new Error('這不是丈量大師（門窗丈量）的備份檔');
    let add=0,rep=0;
    for(const [id,d] of Object.entries(data.photos||{}))if(typeof d==='string'&&d.startsWith('data:image/'))await store.set('photo:'+id,d);
    for(const raw of data.projects){if(!raw||!raw.id||!Array.isArray(raw.items))continue;const np=normProject(raw);
      np.items=np.items.filter(it=>it&&TYPES[it.type]&&it.p);
      const i=projects.findIndex(x=>x.id===np.id);if(i>=0){projects[i]=np;rep++}else{projects.unshift(np);add++}}
    if(data.settings&&!settings.co.name){settings=mergeSettings(data.settings);await refreshLogo();saveSettings()}
    flush();busy(false);toast(`已匯入：新增 ${add} 個、更新 ${rep} 個案場`);go('list')}
  catch(err){busy(false);toast('匯入失敗：'+(err&&err.message||err))}
}

  const prompt=`你是台灣鋁門窗與採光罩的丈量助手。把使用者的口語描述轉成項目清單。
規則：
- 長度一律換算成 mm 整數。使用者沒寫單位時，數字單位是「${unit==='cm'?'公分':'公釐'}」；寫「米」「公尺」要換算；「90乘60」代表寬90、高60。
- 採光罩：長=沿牆長度 L，深=出挑 D，後高=靠牆高 Hb，前高=前端高 Hf；有缺角時 shape="缺角" 並填 nc、nw、nd；前面封玻璃 encF="固定玻璃"。
- 選項欄位只能用括號內的值，沒提到的欄位不要填。
- loc 是位置（如客廳、主臥），qty 是數量，沒說就是 1。
可用類型與欄位：
${spec}
只回覆 JSON 陣列，範例：[{"type":"slide","loc":"客廳","qty":1,"note":"","p":{"W":1800,"H":1200,"panels":2,"series":"氣密窗"}}]
使用者描述：
${txt}`;
  const btn=app.querySelector('[data-act="aiQuick"]');if(btn){btn.disabled=true;btn.textContent='AI 解析中…'}
  try{const out=await AI.json(prompt,{modelTier:'quick'});
    const arr=Array.isArray(out)?out:(out&&Array.isArray(out.items)?out.items:[]);let n=0;
    for(const r of arr){if(!r||!TYPES[r.type])continue;const it=newItem(r.type);
      it.loc=String(r.loc||'').slice(0,30);it.note=String(r.note||'').slice(0,200);it.qty=clamp(parseInt(r.qty,10)||1,1,999);
      const src=r.p||{};
      for(const k of TYPES[r.type].f){if(!(k in src))continue;const F=FIELDS[k],v=src[k];
        if(F.t==='len'){const n2=Math.round(+v);if(n2>0&&n2<30000)it.p[k]=n2}
        else if(F.t==='int'){const n2=parseInt(v,10);if(Number.isFinite(n2))it.p[k]=clamp(n2,F.min,F.max)}
        else if(F.t==='bool')it.p[k]=!!v;
        else{const hit=F.o.find(o=>String(o)===String(v));if(hit!==undefined)it.p[k]=hit}}
      p.items.push(it);n++}
    if(!n){toast('沒有辨識到項目，請描述類型與尺寸');return}
    save();render();toast(`已新增 ${n} 個項目，請逐一確認尺寸`)}
  catch(err){toast(aiErr(err))}
  finally{const b=app.querySelector('[data-act="aiQuick"]');if(b){b.disabled=false;b.textContent='AI 轉成項目'}}
}
async function aiCheck(p,it){
  const out=$('#aiOut'),btn=$('#aiBtn');
  if(aiCtl){aiCtl.abort();aiCtl=null;return}
  const data={類型:TYPES[it.type].n,位置:it.loc,數量:it.qty,備註:it.note,規格:specRows(it).map(r=>r.join('：')).join('；'),系統提醒:warnings(it)};
  if(it.type==='room'){const e=ROOM.elec(it.p.objs);data.家具設備=roomGroup(it.p.objs).map(([n,c])=>n+'×'+c).join('、');
    data.用電估算=e.circuits.map(c=>`${c.name} ${Math.round(c.VA)}VA ${c.nfb}A ${c.wire}${c.elcb?' ELCB':''}`).join('；')+`；主開關${e.mainNfb}A 匯流排${e.bus}A`}
  if(it.type==='canopy'){data.材料明細=canopyBOM(it).map(r=>r.join('：')).join('；');data.障礙物=(it.p.obs||[]).map(o=>`${o.type}/${o.mode}/${o.note||''}`)}
  const imgs=[];for(const id of aiSel){const d=photoCache.get(id)||await store.get('photo:'+id);if(d)imgs.push(dataURLtoBlob(d))}
  const prompt=`${it.type==='room'?'你是台灣資深室內設計師兼甲種電匠，正在幫同行檢查室內平面配置與用電規劃（動線、尺寸、插座與迴路）。':'你是台灣資深鋁門窗與採光罩師傅，正在幫同行檢查現場丈量資料。'}請用繁體中文、條列、精簡回答（300 字內），分成四段：
一、可能漏量或需要再確認的尺寸
二、施工風險（防水、結構、颱風、鄰房或違建疑慮只需提醒）
三、規格建議
四、給工廠下料的注意事項
案場：${p.addr||'未填'}；案場備註：${p.note||'無'}
項目資料：${JSON.stringify(data)}
${imgs.length?`另附 ${imgs.length} 張現場照片，請判讀牆面、開口、周邊狀況後一併給建議。`:'沒有附照片。'}`;
  aiCtl=new AbortController();btn.textContent='停止';out.textContent='思考中…';
  try{await AI(prompt,{signal:aiCtl.signal,images:imgs.length?imgs:undefined,onText:({text})=>{out.textContent=text}})}
  catch(err){out.textContent=(err&&err.text?err.text+'\n\n':'')+aiErr(err)}
  finally{aiCtl=null;const b=$('#aiBtn');if(b)b.textContent='AI 檢查這個項目'}
}

/* ================= 黑科技：離線 PWA、永久儲存、螢幕常亮、備份提醒 ================= */
const canPWA=('serviceWorker' in navigator)&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude|anthropic/i.test(location.hostname);
function daysSince(d){const t=Date.parse(d);return Number.isFinite(t)?Math.floor((Date.now()-t)/864e5):9999}
function backupDue(){return projects.length>0&&(!settings.lastBackup||daysSince(settings.lastBackup)>=7)}
let wakeLock=null;
async function wake(on){
  try{if(on&&settings.wake!==false&&('wakeLock' in navigator)&&document.visibilityState==='visible'){
      if(!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}
    else if(wakeLock){const w=wakeLock;wakeLock=null;await w.release()}}catch(e){wakeLock=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake(view.name==='project'||view.name==='item')});
async function storageInfo(){const el=$('#stInfo');if(!el)return;
  try{const st=navigator.storage;if(!st||!st.estimate){el.textContent='這個瀏覽器無法查詢。';return}
    const [e,per]=await Promise.all([st.estimate(),st.persisted?st.persisted():Promise.resolve(false)]),mb=v=>(v/1048576).toFixed(1);
    if(!el.isConnected)return;
    el.innerHTML=`已使用 ${mb(e.usage||0)} MB／可用約 ${mb(e.quota||0)} MB　${per?'<b style="color:var(--ok)">✓ 已鎖定永久儲存</b>':'<span style="color:var(--danger)">未鎖定永久儲存（空間不足時系統可能清除），建議加入主畫面並定期備份</span>'}`}
  catch(e){el.textContent='無法取得儲存資訊。'}}
async function persistStorage(){try{const st=navigator.storage;if(st&&st.persist&&!(await st.persisted()))await st.persist()}catch(e){}}
function setupPWA(){if(!canPWA)return;
  for(const [rel,href] of [['manifest','manifest.webmanifest'],['apple-touch-icon','icon-180.png']]){const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)}
  navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
    nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('新版本已下載，關閉 App 再開即可更新')})})}).catch(()=>{});
}
addEventListener('offline',()=>toast('已離線：丈量與存檔照常，AI 與首次 3D 載入需要網路'));
addEventListener('online',()=>toast('網路已恢復'));

/* ================= 啟動 ================= */
(async()=>{
  await store.open();
  setupPWA();persistStorage();
  const [s,ps]=await Promise.all([store.get('settings'),store.get('projects')]);
  settings=mergeSettings(s);if(Array.isArray(ps))projects=ps.map(normProject);
  await refreshLogo();
  getDL();
  const sp=useCap('sample');
  AI=await Promise.race([sp,new Promise(r=>setTimeout(()=>r(null),2500))]);
  if(AI){try{const lim=await AI.limits();AIimg=lim&&lim.images||null}catch(e){AIimg=null}}
  render();
  if(!AI)sp.then(async a=>{if(!a)return;AI=a;try{const lim=await a.limits();AIimg=lim&&lim.images||null}catch(e){}
    const ae=document.activeElement;if(!ae||!/INPUT|TEXTAREA|SELECT/.test(ae.tagName))render()});
})();
})();
</script>
